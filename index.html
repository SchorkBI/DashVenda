<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Metas — Corretores</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#12201C; --panel:#1B2A25; --paper:#F4EFE2;
    --gold:#D6A94A; --gold-dim:#8A6E33; --brick:#C97057; --green:#7BB88F;
    --line: rgba(244,239,226,0.14); --muted: rgba(244,239,226,0.6);
    --brand:#008A26; --brand-bright:#3DCB63;
  }
  *{box-sizing:border-box;}
  html,body{ height:100%; }
  body{
    margin:0; background:var(--ink); color:var(--paper); font-family:'Inter', sans-serif;
    background-image:
      repeating-linear-gradient(0deg, rgba(244,239,226,0.035) 0px, rgba(244,239,226,0.035) 1px, transparent 1px, transparent 120px),
      repeating-linear-gradient(90deg, rgba(244,239,226,0.035) 0px, rgba(244,239,226,0.035) 1px, transparent 1px, transparent 120px);
    display:flex; flex-direction:column; padding: 2.2vh 2.6vw; overflow:hidden;
  }

  header{ display:flex; justify-content:space-between; align-items:center; margin-bottom:1.6vh; }
  .eyebrow{ font-family:'IBM Plex Mono', monospace; font-size:1vw; letter-spacing:.16em; text-transform:uppercase; color:var(--brand-bright); margin:0 0 .3vh; font-weight:600; }
  h1{ font-family:'Fraunces', serif; font-weight:600; font-size:2.3vw; margin:0; line-height:1; }
  .headline-left{ display:flex; align-items:center; gap:1.2vw; }
  .headline-left img{ height:3.4vw; display:block; }

  .rail-wrap{ display:flex; align-items:center; gap:1vw; min-width:26vw; }
  .period-rail{ display:flex; gap:.7vw; flex:1; }
  .period-rail .dot{ flex:1; height:5px; border-radius:3px; background: var(--line); position:relative; overflow:hidden; }
  .period-rail .dot.active::after{ content:''; position:absolute; inset:0; background:var(--brand-bright); animation: fillbar var(--rotate-secs) linear forwards; }
  .period-rail .dot.done::after{ content:''; position:absolute; inset:0; background:var(--brand-bright); }
  @keyframes fillbar{ from{width:0%;} to{width:100%;} }
  .period-rail .plabel{ font-family:'IBM Plex Mono', monospace; font-size:.72vw; color:var(--muted); margin-top:.5vh; text-transform:uppercase; letter-spacing:.06em; }
  .period-rail .dot.paused::after{ animation-play-state:paused; }

  .pause-btn{
    font-family:'IBM Plex Mono', monospace; font-size:.72vw; font-weight:600; letter-spacing:.05em;
    background:transparent; border:1px solid var(--line); color:var(--muted); border-radius:6px;
    padding:.5vh .8vw; cursor:pointer; white-space:nowrap;
  }
  .pause-btn:hover{ border-color:var(--brand-bright); color:var(--brand-bright); }
  .pause-btn.is-paused{ border-color:var(--brick); color:var(--brick); }

  .company-strip{
    background:var(--panel); border:1px solid var(--line); border-radius:10px;
    padding:1.6vh 1.8vw; margin-bottom:1vh;
    display:grid; grid-template-columns: 2fr 1fr 1.1fr 1fr 1fr; gap:1.6vw; align-items:center;
  }
  .vgv-block .label{ font-family:'IBM Plex Mono', monospace; font-size:.75vw; color:var(--muted); text-transform:uppercase; letter-spacing:.06em; margin-bottom:.4vh; }
  .vgv-block .row{ display:flex; justify-content:space-between; align-items:baseline; margin-bottom:.6vh; }
  .vgv-block .fig{ font-family:'IBM Plex Mono', monospace; font-weight:700; font-size:1.7vw; color:var(--paper); }
  .vgv-block .goal{ font-family:'IBM Plex Mono', monospace; font-size:.85vw; color:var(--muted); }
  .vgv-block .pct{ font-family:'Fraunces', serif; font-weight:700; font-size:1.5vw; }
  .vgv-block .pct.over{ color:var(--green); } .vgv-block .pct.mid{ color:var(--gold); } .vgv-block .pct.low{ color:var(--brick); }
  .bar{ position:relative; height:1.1vh; background:rgba(244,239,226,0.1); border-radius:4px; overflow:hidden; }
  .bar .fill{ position:absolute; top:0; left:0; height:100%; background:var(--gold); transition:width .6s ease; border-radius:4px; }
  .bar .fill.over{ background:var(--green); }

  .stat-chip{ text-align:center; border-left:1px solid var(--line); padding-left:1.6vw; }
  .stat-chip .label{ font-family:'IBM Plex Mono', monospace; font-size:.72vw; color:var(--muted); text-transform:uppercase; letter-spacing:.05em; margin-bottom:.4vh; }
  .stat-chip .fig{ font-family:'IBM Plex Mono', monospace; font-weight:700; font-size:1.6vw; color:var(--paper); }
  .stat-chip .sub{ font-family:'IBM Plex Mono', monospace; font-size:.7vw; color:var(--muted); margin-top:.3vh; }

  .meta-line{
    display:flex; align-items:center; gap:1.4vw; margin-bottom:1.2vh;
    font-family:'IBM Plex Mono', monospace; font-size:.78vw; color:var(--muted); letter-spacing:.03em;
  }
  .meta-line .time{ color:var(--paper); font-weight:600; font-size:.95vw; }
  .meta-line a, .meta-line label{ cursor:pointer; text-decoration:underline; color:var(--muted); }
  .meta-line .dot-sep{ opacity:.5; }

  main{ flex:1; display:grid; grid-template-columns: 1fr 1fr; gap:1.6vw; min-height:0; }
  .board{ background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:1.6vh 1.6vw; display:flex; flex-direction:column; min-height:0; overflow:hidden; }

  .ranktable{ width:100%; table-layout:fixed; border-collapse:collapse; }
  .ranktable thead th{
    font-family:'IBM Plex Mono', monospace; font-size:.68vw; color:var(--muted); text-transform:uppercase; letter-spacing:.03em;
    text-align:right; border-bottom:1px solid var(--line); padding:0 0 .9vh; font-weight:600;
  }
  .ranktable thead th:nth-child(1), .ranktable thead th:nth-child(2){ text-align:left; }
  .ranktable tbody td{
    padding:.8vh 0; border-bottom:1px solid rgba(244,239,226,0.06);
    overflow:hidden; white-space:nowrap; text-overflow:ellipsis;
  }
  .ranktable tbody tr:last-child td{ border-bottom:none; }
  .ranktable td.pos{ font-family:'IBM Plex Mono', monospace; color:var(--gold-dim); font-size:.88vw; font-weight:600; }
  .ranktable tr.first td.pos{ color:var(--gold); }
  .ranktable td.pname{ font-family:'Fraunces', serif; font-size:1vw; font-weight:600; padding-right:.4vw; }
  .ranktable td.pnum{ font-family:'IBM Plex Mono', monospace; font-size:.88vw; text-align:right; color:var(--muted); }
  .ranktable td.pvgv{ font-family:'IBM Plex Mono', monospace; font-size:.92vw; font-weight:700; text-align:right; color:var(--brick); }
  .ranktable td.pvgv.mid{ color:var(--gold); } .ranktable td.pvgv.hit{ color:var(--green); }
  .ranktable td.pag{ font-family:'IBM Plex Mono', monospace; font-size:.88vw; font-weight:700; text-align:right; color:var(--brick); }
  .ranktable td.pag.mid{ color:var(--gold); } .ranktable td.pag.hit{ color:var(--green); }
  .ranktable .c{ font-weight:400; opacity:.7; font-size:.68vw; }

  .podium-title{
    font-family:'Fraunces', serif; font-weight:700; font-size:1.3vw; margin:0 0 1.6vh;
    text-align:center; color:var(--paper); border-bottom:1px solid var(--line); padding-bottom:1.2vh;
  }
  .podium-title .sub{ display:block; font-family:'IBM Plex Mono', monospace; font-size:.72vw; color:var(--muted); font-weight:400; text-transform:uppercase; letter-spacing:.06em; margin-top:.5vh; }
  .podium-row{ display:flex; align-items:center; gap:1vw; padding:1.6vh 0; border-bottom:1px solid rgba(244,239,226,0.06); }
  .podium-row:last-child{ border-bottom:none; }
  .podium-row .medal{ font-size:1.8vw; width:2.4vw; text-align:center; }
  .podium-row .ppos{ font-family:'IBM Plex Mono', monospace; color:var(--gold-dim); font-size:1vw; font-weight:600; width:1.6vw; }
  .podium-row.first .ppos{ color:var(--gold); }
  .podium-row .pinfo{ flex:1; min-width:0; }
  .podium-row .pinfo .pname3{ font-family:'Fraunces', serif; font-weight:700; font-size:1.25vw; color:var(--paper); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .podium-row .pinfo .pval3{ font-family:'IBM Plex Mono', monospace; font-size:1.05vw; color:var(--brand-bright); font-weight:600; margin-top:.2vh; }
  .podium-empty{ font-family:'IBM Plex Mono', monospace; font-size:.9vw; color:var(--muted); text-align:center; padding:2vh 0; }
</style>
</head>

const QUARTER_LABEL = ["1º Trimestre (Jan–Mar)","2º Trimestre (Abr–Jun)","3º Trimestre (Jul–Set)","4º Trimestre (Out–Dez)"];

const MES_NOME = ["Janeiro","Fevereiro","Março","Abril","Maio","Junho","Julho","Agosto","Setembro","Outubro","Novembro","Dezembro"];

const MONTH_GOAL   = { vgv:700000,   ag:6,  agCentral:2 };   // meta individual, por corretor
const QUARTER_GOAL = { vgv:2100000,  ag:18, agCentral:6 };   // meta individual, por corretor
const YEAR_GOAL    = { vgv:8700000,  ag:72, agCentral:24 };  // meta individual, por corretor

// Meta da imobiliária: valor fixo, independente do número de corretores ativos
// (a equipe muda ao longo do ano, então não é a soma das metas individuais).
const COMPANY_GOAL = {
  mes:       8000000,
  trimestre: 24000000,
  ano:       96000000,
};

const ORDER = ['mes','trimestre','ano','podio_venda','podio_ag'];
const ROTATE_SECS = 40;
const REFRESH_MS = 20000;

let monthsData = Array.from({length:12}, () => CORRETORES.map(() => ({ vgv:0, vgvAgVendidos:0, vdAgVendidos:0, agCentral:0, agOutras:0, vendas:0, visitas:0, propostas:0 })));
let periodIdx = 0;
let isPaused = false;

function setPaused(value){
  isPaused = value;
  const btn = document.getElementById('pause-btn');
  if(btn){
    btn.textContent = isPaused ? 'Retomar' : 'Pausar';
    btn.classList.toggle('is-paused', isPaused);
  }
  renderRail();
}

const fmtBRL = n => n.toLocaleString('pt-BR', { style:'currency', currency:'BRL', maximumFractionDigits:0 });
const fmtBRLcompact = n => n.toLocaleString('pt-BR', { style:'currency', currency:'BRL', notation:'compact', maximumFractionDigits:1 });
const fmtInt = n => n.toLocaleString('pt-BR');

function sumMonth(mIdx){
  const d = monthsData[mIdx];
  const vgv = d.reduce((s,r)=> s + (Number(r.vgv)||0), 0);
  const vgvAgVendidos = d.reduce((s,r)=> s + (Number(r.vgvAgVendidos)||0), 0);
  const vdAgVendidos = d.reduce((s,r)=> s + (Number(r.vdAgVendidos)||0), 0);
  const agCentral = d.reduce((s,r)=> s + (Number(r.agCentral)||0), 0);
  const agOutras = d.reduce((s,r)=> s + (Number(r.agOutras)||0), 0);
  const vendas = d.reduce((s,r)=> s + (Number(r.vendas)||0), 0);
  const visitas = d.reduce((s,r)=> s + (Number(r.visitas)||0), 0);
  const propostas = d.reduce((s,r)=> s + (Number(r.propostas)||0), 0);
  return { vgv, vgvAgVendidos, vdAgVendidos, agCentral, agOutras, ag: agCentral+agOutras, vendas, visitas, propostas };
}
function sumMonths(idxs){
  return idxs.map(sumMonth).reduce((a,b)=>({
    vgv:a.vgv+b.vgv, vgvAgVendidos:a.vgvAgVendidos+b.vgvAgVendidos, vdAgVendidos:a.vdAgVendidos+b.vdAgVendidos, agCentral:a.agCentral+b.agCentral, agOutras:a.agOutras+b.agOutras, ag:a.ag+b.ag,
    vendas:a.vendas+b.vendas, visitas:a.visitas+b.visitas, propostas:a.propostas+b.propostas
  }), {vgv:0,vgvAgVendidos:0,vdAgVendidos:0,agCentral:0,agOutras:0,ag:0,vendas:0,visitas:0,propostas:0});
}

const STORAGE_KEY = 'schork-metas-months';
const STORAGE_EXPORTED_AT_KEY = 'schork-metas-exported-at';

async function loadData(){
  // 1) Fonte compartilhada: arquivo dados.json hospedado junto com esta pagina.
  //    E o que faz o painel atualizar automatico pra todas as TVs. O ?t=... evita cache.
  try{
    const resp = await fetch('dados.json?t=' + Date.now(), { cache: 'no-store' });
    if(resp.ok){
      const parsed = await resp.json();
      const months = Array.isArray(parsed) ? parsed : parsed.months;
      const exportedAt = Array.isArray(parsed) ? null : parsed.exportedAt;
      if(Array.isArray(months) && months.length === 12){
        monthsData = months;
        try{
          localStorage.setItem(STORAGE_KEY, JSON.stringify(months));
          if(exportedAt) localStorage.setItem(STORAGE_EXPORTED_AT_KEY, exportedAt);
        }catch(e){}
        return;
      }
    }
  }catch(e){ /* sem dados.json (ex.: aberto como arquivo local) — cai no plano B */ }

  // 2) Plano B: dados salvos no proprio navegador via botao "importar dados".
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw){
      const parsed = JSON.parse(raw);
      if(Array.isArray(parsed) && parsed.length === 12) monthsData = parsed;
    }
  }catch(e){ console.error('Falha ao carregar dados salvos', e); }
}

function fmtStamp(iso){
  const d = new Date(iso);
  return d.toLocaleDateString('pt-BR', {day:'2-digit', month:'2-digit'}) + ' às ' + d.toLocaleTimeString('pt-BR', {hour:'2-digit', minute:'2-digit'});
}

function showSourceBadge(){
  const exportedAt = localStorage.getItem(STORAGE_EXPORTED_AT_KEY);
  const el = document.getElementById('import-msg');
  if(el) el.textContent = exportedAt ? ('· dados gerados no painel em ' + fmtStamp(exportedAt)) : '';
}

function importDataFromFile(file){
  const reader = new FileReader();
  reader.onload = (e) => {
    try{
      const parsed = JSON.parse(e.target.result);
      const months = Array.isArray(parsed) ? parsed : parsed.months;
      const exportedAt = Array.isArray(parsed) ? null : parsed.exportedAt;
      if(Array.isArray(months) && months.length === 12){
        monthsData = months;
        localStorage.setItem(STORAGE_KEY, JSON.stringify(monthsData));
        if(exportedAt) localStorage.setItem(STORAGE_EXPORTED_AT_KEY, exportedAt);
        renderPeriod();
        showSourceBadge();
      }
    }catch(err){ /* arquivo inválido, ignora */ }
  };
  reader.readAsText(file);
}

function pctClass(pct){ return pct >= 100 ? 'over' : (pct >= 60 ? 'mid' : 'low'); }

function renderRail(){
  const rail = document.getElementById('rail');
  const labels = { mes: MES_NOME[new Date().getMonth()], trimestre: 'Trimestre', ano: 'Ano', podio_venda: 'Pódio Venda', podio_ag: 'Pódio Agenc.' };
  rail.innerHTML = ORDER.map((p,i) => `
    <div data-idx="${i}" style="cursor:pointer;">
      <div class="dot ${i===periodIdx?'active':(i<periodIdx?'done':'')} ${isPaused?'paused':''}" style="--rotate-secs:${ROTATE_SECS}s"></div>
      <div class="plabel">${labels[p]}</div>
    </div>
  `).join('');
  rail.querySelectorAll('[data-idx]').forEach(el => {
    el.addEventListener('click', () => {
      periodIdx = Number(el.dataset.idx);
      setPaused(true);
      renderPeriod();
    });
  });
}

function currentPeriodData(){
  const key = ORDER[periodIdx];
  const now = new Date();
  const mIdx = now.getMonth();
  if(key === 'mes'){
    return { title: 'Metas de ' + MES_NOME[mIdx], totals: sumMonth(mIdx), individualGoal: MONTH_GOAL, companyVgvGoal: COMPANY_GOAL.mes };
  }
  if(key === 'trimestre'){
    const q = QUARTER_OF_MONTH[mIdx];
    return { title: 'Metas do ' + QUARTER_LABEL[q], totals: sumMonths(QUARTER_MONTHS[q]), individualGoal: QUARTER_GOAL, companyVgvGoal: COMPANY_GOAL.trimestre };
  }
  return { title: 'Metas do Ano', totals: sumMonths([...Array(12).keys()]), individualGoal: YEAR_GOAL, companyVgvGoal: COMPANY_GOAL.ano };
}

function rankingFor(){
  const key = ORDER[periodIdx];
  const now = new Date();
  const mIdx = now.getMonth();
  let monthIdxs;
  if(key === 'mes') monthIdxs = [mIdx];
  else if(key === 'trimestre') monthIdxs = QUARTER_MONTHS[QUARTER_OF_MONTH[mIdx]];
  else monthIdxs = [...Array(12).keys()];

  return CORRETORES.map((name,i) => {
    const vgv = monthIdxs.reduce((s,mi) => s + (Number(monthsData[mi][i].vgv)||0), 0);
    const vgvAgVendidos = monthIdxs.reduce((s,mi) => s + (Number(monthsData[mi][i].vgvAgVendidos)||0), 0);
    const vdAgVendidos = monthIdxs.reduce((s,mi) => s + (Number(monthsData[mi][i].vdAgVendidos)||0), 0);
    const agCentral = monthIdxs.reduce((s,mi) => s + (Number(monthsData[mi][i].agCentral)||0), 0);
    const agOutras = monthIdxs.reduce((s,mi) => s + (Number(monthsData[mi][i].agOutras)||0), 0);
    const vendas = monthIdxs.reduce((s,mi) => s + (Number(monthsData[mi][i].vendas)||0), 0);
    const visitas = monthIdxs.reduce((s,mi) => s + (Number(monthsData[mi][i].visitas)||0), 0);
    const propostas = monthIdxs.reduce((s,mi) => s + (Number(monthsData[mi][i].propostas)||0), 0);
    return { name, vgv, vgvAgVendidos, vdAgVendidos, agCentral, agOutras, ag: agCentral+agOutras, vendas, visitas, propostas };
  }).sort((a,b) => b.vgv - a.vgv);
}

function statusClass(pct){ return pct>=100 ? 'hit' : (pct>=60 ? 'mid' : ''); }
function agStatusClass(total, central, goalTotal, goalCentral){
  const hit = goalTotal && total >= goalTotal && goalCentral && central >= goalCentral;
  if(hit) return 'hit';
  const pctTotal = goalTotal ? (total/goalTotal)*100 : 0;
  return pctTotal >= 60 ? 'mid' : '';
}

function metricTotalsFor(periodKey){
  const now = new Date();
  const mIdx = now.getMonth();
  let monthIdxs;
  if(periodKey === 'mes') monthIdxs = [mIdx];
  else if(periodKey === 'trimestre') monthIdxs = QUARTER_MONTHS[QUARTER_OF_MONTH[mIdx]];
  else monthIdxs = [...Array(12).keys()];

  return CORRETORES.map((name,i) => {
    const vgv = monthIdxs.reduce((s,mi) => s + (Number(monthsData[mi][i].vgv)||0), 0);
    const vgvAgVendidos = monthIdxs.reduce((s,mi) => s + (Number(monthsData[mi][i].vgvAgVendidos)||0), 0);
    return { name, vgv, vgvAgVendidos };
  });
}

function top3For(periodKey, metric){
  return metricTotalsFor(periodKey)
    .map(r => ({ name: r.name, value: r[metric] }))
    .sort((a,b) => b.value - a.value)
    .slice(0, 3);
}

function podiumCardHTML(title, sub, items){
  const medals = ['🥇','🥈','🥉'];
  const rows = items.length
    ? items.map((it,i) => `
        <div class="podium-row ${i===0?'first':''}">
          <span class="medal">${medals[i]}</span>
          <span class="ppos">${i+1}º</span>
          <div class="pinfo">
            <div class="pname3">${it.name}</div>
            <div class="pval3">${fmtBRL(it.value)}</div>
          </div>
        </div>
      `).join('')
    : `<div class="podium-empty">Sem lançamentos neste período</div>`;
  return `
    <div class="podium-title">${title}<span class="sub">${sub}</span></div>
    ${rows}
  `;
}

function renderPodiumView(key){
  const metric = key === 'podio_venda' ? 'vgv' : 'vgvAgVendidos';
  document.getElementById('period-title').textContent = key === 'podio_venda' ? 'Pódio — VGV de Venda' : 'Pódio — VGV de Agenciamento';

  document.getElementById('company-strip').innerHTML = `
    <div style="grid-column:1/-1; text-align:center; font-family:'IBM Plex Mono', monospace; font-size:.85vw; color:var(--muted); text-transform:uppercase; letter-spacing:.08em;">
      1º, 2º e 3º lugar — mês, trimestre e ano
    </div>
  `;

  document.getElementById('main-area').style.gridTemplateColumns = '1fr 1fr 1fr';
  document.getElementById('board-third').style.display = 'flex';

  const now = new Date();
  const mIdx = now.getMonth();
  const periods = [
    { key:'mes', title: MES_NOME[mIdx], sub:'Mês' },
    { key:'trimestre', title: QUARTER_LABEL[QUARTER_OF_MONTH[mIdx]].split(' (')[0], sub:'Trimestre' },
    { key:'ano', title: 'Ano', sub: String(now.getFullYear()) },
  ];
  ['board-left','board-right','board-third'].forEach((boardId, i) => {
    const p = periods[i];
    document.getElementById(boardId).innerHTML = podiumCardHTML(p.title, p.sub, top3For(p.key, metric));
  });
}

function renderPeriod(){
  const key = ORDER[periodIdx];

  if(key === 'podio_venda' || key === 'podio_ag'){
    renderPodiumView(key);
    renderRail();
    return;
  }

  document.getElementById('main-area').style.gridTemplateColumns = '';
  document.getElementById('board-third').style.display = 'none';

  const { title, totals, individualGoal, companyVgvGoal } = currentPeriodData();
  document.getElementById('period-title').textContent = title;

  const pctVgv = companyVgvGoal ? (totals.vgv/companyVgvGoal)*100 : 0;

  document.getElementById('company-strip').innerHTML = `
    <div class="vgv-block">
      <div class="label">VGV da imobiliária · meta ${fmtBRL(companyVgvGoal)}</div>
      <div class="row">
        <span class="fig">${fmtBRL(totals.vgv)}</span>
        <span class="pct ${pctClass(pctVgv)}">${pctVgv.toFixed(0)}%</span>
      </div>
      <div class="bar"><div class="fill ${pctVgv>=100?'over':''}" style="width:${Math.min(pctVgv,100)}%"></div></div>
    </div>
    <div class="stat-chip">
      <div class="label">Vendas</div>
      <div class="fig">${fmtInt(totals.vendas)}</div>
      <div class="sub">imóveis</div>
    </div>
    <div class="stat-chip">
      <div class="label">Agenciamentos</div>
      <div class="fig">${fmtInt(totals.ag)}</div>
      <div class="sub">${totals.agCentral} região central</div>
    </div>
    <div class="stat-chip">
      <div class="label">Visitas</div>
      <div class="fig">${fmtInt(totals.visitas)}</div>
      <div class="sub">&nbsp;</div>
    </div>
    <div class="stat-chip">
      <div class="label">Propostas</div>
      <div class="fig">${fmtInt(totals.propostas)}</div>
      <div class="sub">&nbsp;</div>
    </div>
  `;

  const ranked = rankingFor();
  const half = Math.ceil(ranked.length / 2);
  const columns = [ranked.slice(0, half), ranked.slice(half)];
  const startIdx = [0, half];

  const colgroup = `
    <colgroup>
      <col style="width:5%"><col style="width:23%"><col style="width:19%">
      <col style="width:18%"><col style="width:15%"><col style="width:10%"><col style="width:10%">
    </colgroup>
  `;
  const headRow = `
    <thead><tr>
      <th></th><th>Corretor</th><th>VGV (vd)</th><th>VGV ag. (qtd)</th><th>Ag (C)</th><th>Vis</th><th>Prop</th>
    </tr></thead>
  `;

  ['board-left','board-right'].forEach((boardId, colI) => {
    const rows = columns[colI].map((r,i) => {
      const globalIdx = startIdx[colI] + i;
      const pctVgvRow = individualGoal.vgv ? (r.vgv / individualGoal.vgv) * 100 : 0;
      const vgvCls = statusClass(pctVgvRow);
      const agCls = agStatusClass(r.ag, r.agCentral, individualGoal.ag, individualGoal.agCentral);
      return `
        <tr class="${globalIdx===0 ? 'first' : ''}">
          <td class="pos">${globalIdx+1}</td>
          <td class="pname">${r.name}</td>
          <td class="pvgv ${vgvCls}">${fmtBRLcompact(r.vgv)} <span class="c">(${r.vendas})</span></td>
          <td class="pnum">${fmtBRLcompact(r.vgvAgVendidos)} <span class="c">(${r.vdAgVendidos})</span></td>
          <td class="pag ${agCls}">${r.ag} <span class="c">(${r.agCentral})</span></td>
          <td class="pnum">${r.visitas}</td>
          <td class="pnum">${r.propostas}</td>
        </tr>
      `;
    }).join('');
    document.getElementById(boardId).innerHTML = `<table class="ranktable">${colgroup}${headRow}<tbody>${rows}</tbody></table>`;
  });

  renderRail();
}

function tickClock(){
  const now = new Date();
  document.getElementById('date').textContent = now.toLocaleDateString('pt-BR', { weekday:'long', day:'2-digit', month:'long' });
  document.getElementById('time').textContent = now.toLocaleTimeString('pt-BR', { hour:'2-digit', minute:'2-digit' });
}

async function refreshData(){
  await loadData();
  document.getElementById('updated').textContent = 'atualizado às ' + new Date().toLocaleTimeString('pt-BR', { hour:'2-digit', minute:'2-digit' });
  renderPeriod();
}

document.getElementById('import-input').addEventListener('change', (e) => {
  const file = e.target.files[0];
  if(file) importDataFromFile(file);
  e.target.value = '';
});

document.getElementById('pause-btn').addEventListener('click', () => setPaused(!isPaused));

async function init(){
  await refreshData();
  showSourceBadge();
  tickClock();
  setInterval(tickClock, 30000);
  setInterval(refreshData, REFRESH_MS);
  setInterval(() => {
    if(isPaused) return;
    periodIdx = (periodIdx + 1) % ORDER.length;
    renderPeriod();
  }, ROTATE_SECS * 1000);
}
init();
</script>
</body>
</html>
